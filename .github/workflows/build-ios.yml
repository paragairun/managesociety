  #   RESIDENT_PROVISIONING_PROFILE  base64 .mobileprovision for
  #                                  in.managesociety.resident
  #   GUARD_PROVISIONING_PROFILE     base64 .mobileprovision for
  #                                  in.managesociety.guard
