name: Build iOS Apps

# Builds the iOS resident and guard apps on a GitHub-hosted Mac, so no
# Mac of your own is needed. Same shell idea as the Android apps: each
# loads the live site, so ordinary web changes reach users with no
# rebuild. Rebuild only when the native shell changes (icon,
# permissions, app name, the URL it opens).
#
# A matrix over the two apps rather than two near-identical jobs,
# matching build-release-aabs.yml. Adding a third shell later means one
# more line under `include`.
#
# WHAT THIS PRODUCES TODAY
# UNSIGNED simulator builds (.app, zipped, under the run's Artifacts),
# one per app. Drag either onto an iOS Simulator on any Mac and it
# runs. Neither will install on a physical iPhone, and neither can go
# to TestFlight or the App Store — those need an Apple Developer
# Program membership ($99/year), which is not set up yet.
#
# WHAT CHANGES WHEN YOU ENROL
# The signed job at the bottom is written and commented out. Enrol, add
# the repository secrets it lists, uncomment it. Nothing above changes.
#
# PUSH NOTIFICATIONS
# Also gated on enrolment. Apple push needs an APNs key from the Apple
# Developer portal and the Push Notifications capability on a real App
# ID. The app code is ready — usePushNotifications is mounted on both
# the resident and guard dashboards and reports the real platform — but
# nothing will be delivered on iOS until that key exists.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-resident/**'
      - 'mobile-guard/**'
      - 'scripts/configure-ios.mjs'
      - '.github/workflows/build-ios.yml'

jobs:
  build-simulator:
    name: ${{ matrix.role }} (unsigned simulator)
    runs-on: macos-latest

    strategy:
      # One app failing should not hide whether the other builds.
      fail-fast: false
      matrix:
        include:
          - role: resident
            app_dir: mobile-resident
            app_id: in.managesociety.resident
          - role: guard
            app_dir: mobile-guard
            app_id: in.managesociety.guard

    steps:
      - uses: actions/checkout@v4

      # 22, not 20: @capacitor/cli 8.x refuses to run below Node 22
      # ("The Capacitor CLI requires NodeJS >=22.0.0"). The Android
      # workflows have no setup-node step at all and inherit the
      # runner's Node, which is already above that — pinning 20 here was
      # a downgrade below the floor, which is worse than not pinning.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ matrix.app_dir }}
        run: npm install --no-audit --no-fund

      # The ios/ directory is generated output, like android/ is for the
      # Android build. It is not committed: ~60 Xcode files Capacitor
      # recreates deterministically, where a stale committed copy is
      # worse than none. Regenerated every run.
      - name: Generate the iOS project
        working-directory: ${{ matrix.app_dir }}
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            npx cap add ios
          else
            npx cap sync ios
          fi

      # App.xcworkspace is produced by CocoaPods, not by Capacitor.
      # `cap add ios` tries to run pod install itself and only WARNS if
      # it cannot, so a missing or failed CocoaPods leaves an
      # App.xcodeproj with no workspace and the build fails later with
      # "'ios/App/App.xcworkspace' does not exist" — which says nothing
      # about the real cause. Done explicitly here so a pod failure
      # fails this step, by name.
      - name: Resolve CocoaPods
        working-directory: ${{ matrix.app_dir }}
        run: |
          set -euo pipefail
          if [ ! -f ios/App/Podfile ]; then
            echo "::error::ios/App/Podfile is missing, so the previous step did not generate a complete iOS project."
            ls -la ios 2>/dev/null || echo "(no ios directory at all)"
            exit 1
          fi
          if ! command -v pod >/dev/null 2>&1; then
            echo "CocoaPods not on PATH; installing."
            sudo gem install cocoapods --no-document || brew install cocoapods
          fi
          pod --version
          cd ios/App
          pod install --repo-update

      # Printed whether or not the build succeeds. The first failure
      # here was unreadable because nothing reported what the generated
      # directory actually contained.
      - name: Show the generated iOS project
        if: always()
        working-directory: ${{ matrix.app_dir }}
        run: |
          echo "--- ios/App ---"
          ls -la ios/App || echo "(ios/App does not exist)"
          if [ -d ios/App/App.xcworkspace ]; then
            echo "--- schemes ---"
            xcodebuild -workspace ios/App/App.xcworkspace -list || true
          else
            echo "::error::ios/App/App.xcworkspace was not created. CocoaPods did not produce a workspace; see the Resolve CocoaPods step above."
          fi

      # Rewrites utm_source to ios_app. Run from the repo root, since
      # one copy of this script serves both apps.
      - name: Apply iOS-specific configuration
        run: node scripts/configure-ios.mjs "${{ matrix.app_dir }}"

      # The same class of mistake as the Android apps opening a route
      # that had been deleted: nothing else in the pipeline reads this
      # URL, so assert it here. Mirrors the EXPECTED_URL check in
      # build-release-aabs.yml.
      - name: Check the app will open the right URL
        working-directory: ${{ matrix.app_dir }}
        env:
          EXPECTED_URL: https://managesociety.in/${{ matrix.role }}?utm_source=ios_app&utm_medium=app
        run: |
          set -euo pipefail
          URL="$(node -e "console.log(require('./ios/App/App/capacitor.config.json').server.url)")"
          echo "config says: ${URL}"
          [[ "${URL}" == "${EXPECTED_URL}" ]] || {
            echo "::error::The app would open '${URL}', expected '${EXPECTED_URL}'. Check ${{ matrix.app_dir }}/capacitor.config.ts."
            exit 1; }
          ID="$(node -e "console.log(require('./ios/App/App/capacitor.config.json').appId)")"
          [[ "${ID}" == "${{ matrix.app_id }}" ]] || {
            echo "::error::appId is '${ID}', expected '${{ matrix.app_id }}'."
            exit 1; }

      - name: Build for the simulator
        working-directory: ${{ matrix.app_dir }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package the .app
        working-directory: ${{ matrix.app_dir }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products -maxdepth 2 -name 'App.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No App.app was produced; the build step above did not fail but emitted nothing."
            exit 1
          fi
          echo "Found $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "ManageSociety-${{ matrix.role }}-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: managesociety-${{ matrix.role }}-ios-simulator
          path: ${{ matrix.app_dir }}/ManageSociety-${{ matrix.role }}-simulator.zip
          if-no-files-found: error

