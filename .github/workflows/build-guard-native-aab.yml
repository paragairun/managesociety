name: Build Guard Native AAB (Play Store)

# Builds a signed .aab of the NATIVE guard app (native/guard) for Google Play.
#
# This app publishes to the SAME Play listing as the Capacitor guard app --
# both are in.managesociety.guard, signed with the same GUARD_* keystore --
# because it is meant to REPLACE it. Shipping a bundle from here and rolling
# it out means every guard's next app update swaps the WebView shell for the
# native app. There is no going back short of publishing the Capacitor app
# again with a higher versionCode.
#
# So this workflow is manual only, and deliberately does NOT run on push.
#
# WHY A SEPARATE WORKFLOW FROM build-release-aabs.yml
# That one is a matrix over mobile-resident and mobile-guard: it runs
# `npx cap sync android` and validates capacitor.config.json, neither of which
# exists here. The native app's project is generated by `expo prebuild`
# instead. The version scheme, the signing secrets and the bundletool
# inspection are deliberately identical, so the two produce comparable
# artifacts on one versionCode timeline.
#
# WHY NOT build-guard-native.yml
# That workflow publishes its APK to a public GitHub Release so a phone can
# install it. A signed Play bundle should not be public, and an .aab cannot be
# installed by hand anyway. This one leaves the bundle as a build artifact,
# exactly as the Capacitor Play workflow does.
#
# VERSIONS ARE AUTOMATIC
#   versionCode = minutes since 2024-01-01 UTC. Always higher than any earlier
#                 build from EITHER workflow, which is what lets this app take
#                 over the listing.
#   versionName = the "version_name" box when given, else <date>.<run>.
#
# One-time setup -- repo secrets, already present for the Capacitor app:
#   GUARD_KEYSTORE_BASE64, GUARD_STORE_PASSWORD, GUARD_KEY_ALIAS, GUARD_KEY_PASSWORD
#
# Output: app-release.aab under the run's Artifacts, ready for Play Console.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to users (e.g. 4.0). Empty for <date>.<run>."
        required: false
        default: ""
      architectures:
        description: "CPU architectures to include in the bundle"
        type: choice
        required: true
        default: "arm64 + 32-bit ARM — covers every phone in service"
        options:
          - "arm64 + 32-bit ARM — covers every phone in service"
          - "arm64 only — drops pre-2017 hardware"

env:
  APP_DIR: native/guard
  APP_ID: in.managesociety.guard
  BUNDLETOOL_VERSION: 1.18.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # JDK 17: what React Native 0.88 and Expo SDK 58 are built against.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Compute the version
        id: v
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          # Minutes since 2024-01-01T00:00:00Z. Identical to
          # build-release-aabs.yml on purpose: one timeline, shared with the
          # Capacitor guard app this replaces, so a code is never reused and
          # never goes backwards.
          CODE=$(( ( $(date -u +%s) - 1704067200 ) / 60 ))
          if [[ -n "${INPUT_VERSION_NAME}" ]]; then
            NAME="${INPUT_VERSION_NAME}"
          else
            NAME="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "${NAME}" =~ ^[0-9A-Za-z._-]{1,40}$ ]]; then
            echo "::error::Invalid version name '${NAME}' (letters, digits, . _ - only)"; exit 1
          fi
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Version ${NAME} (versionCode ${CODE})"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      # Same check as build-guard-native.yml: a Play bundle embeds the
      # JavaScript, so a missing shared module would ship as a blank screen on
      # a guard's phone rather than fail here.
      - name: Check the shared modules the app imports are present
        run: |
          set -euo pipefail
          missing=0
          for f in gateScan gatePorts visitorFlow visitorFlowPorts deliveries societyStructure staffAttendance; do
            if [[ ! -f "src/lib/$f.ts" ]]; then
              echo "::error::src/lib/$f.ts is missing; native/guard imports it as @core/$f"
              missing=1
            fi
          done
          [[ $missing -eq 0 ]] || exit 1

      - name: Typecheck
        working-directory: ${{ env.APP_DIR }}
        run: npx tsc --noEmit

      # app.config.js reads these and overrides what app.json declares. The
      # version has to reach Expo HERE, before the Android project is
      # generated: Expo writes versionCode into the project at prebuild time,
      # so a Gradle -P property would arrive too late, which is the one way
      # this differs from the Capacitor workflow.
      - name: Generate the native Android project
        working-directory: ${{ env.APP_DIR }}
        env:
          APP_VERSION_CODE: ${{ steps.v.outputs.code }}
          APP_VERSION_NAME: ${{ steps.v.outputs.name }}
        run: npx expo prebuild --platform android --clean

      - name: Check the identity Play will see
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION_CODE: ${{ steps.v.outputs.code }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle

          FOUND_ID=$(grep applicationId "$GRADLE" | head -1 | tr -d "\"' " | sed 's/^applicationId//')
          FOUND_CODE=$(grep versionCode "$GRADLE" | head -1 | tr -d "\"' " | sed 's/^versionCode//')
          FOUND_NAME=$(grep versionName "$GRADLE" | head -1 | tr -d "\"' " | sed 's/^versionName//')
          echo "applicationId=${FOUND_ID} versionCode=${FOUND_CODE} versionName=${FOUND_NAME}"

          # Play only accepts updates carrying the same application id, and
          # google-services.json is registered against it. Renaming it broke
          # the Capacitor builds on 2026-10-04.
          [[ "${FOUND_ID}" == "${APP_ID}" ]] || {
            echo "::error::applicationId is '${FOUND_ID}', expected '${APP_ID}'."; exit 1; }

          # Proves app.config.js actually took effect. Left at app.json's 1,
          # Play would reject the upload after a ten-minute build.
          [[ "${FOUND_CODE}" == "${VERSION_CODE}" ]] || {
            echo "::error::versionCode is '${FOUND_CODE}', expected '${VERSION_CODE}'. app.config.js did not pick up APP_VERSION_CODE."; exit 1; }
          [[ "${FOUND_NAME}" == "${VERSION_NAME}" ]] || {
            echo "::error::versionName is '${FOUND_NAME}', expected '${VERSION_NAME}'."; exit 1; }

          GS=android/app/google-services.json
          [[ -f "$GS" ]] || { echo "::error::google-services.json was not copied in."; exit 1; }
          jq -e --arg id "${APP_ID}" \
            '[.client[].client_info.android_client_info.package_name] | index($id)' "$GS" > /dev/null || {
            echo "::error::google-services.json has no client for ${APP_ID}; push would not initialise."; exit 1; }

          # A society guard app has no business asking for the microphone, and
          # a permission Play users can see is worth failing a build over.
          # expo-camera adds RECORD_AUDIO unless recordAudioAndroid is false
          # in app.json.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            echo "::error::The manifest requests RECORD_AUDIO. Set recordAudioAndroid: false on the expo-camera plugin in app.json."
            exit 1
          fi
          echo "Permissions requested:"
          grep -oE 'android:name="android\.permission\.[A-Z_]+"' "$MANIFEST" | sort -u

      - name: Decode the release keystore
        working-directory: ${{ env.APP_DIR }}/android/app
        run: echo "${{ secrets.GUARD_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      # Signed through AGP's injected signing properties rather than by
      # editing the generated build.gradle, which `expo prebuild --clean`
      # rewrites on every run. These are the same properties Android Studio's
      # "Generate Signed Bundle" uses.
      #
      # Expo's generated project signs release with the DEBUG keystore unless
      # told otherwise, so if this ever silently failed to apply, the bundle
      # would be debug-signed and Play would reject it -- or worse, be
      # accepted into a track and fail to update anyone's app. The next step
      # compares certificate fingerprints rather than trusting it.
      - name: Build the signed AAB
        working-directory: ${{ env.APP_DIR }}/android
        env:
          VERSION_CODE: ${{ steps.v.outputs.code }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          ARCH_CHOICE: ${{ inputs.architectures }}
          STORE_PASSWORD: ${{ secrets.GUARD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GUARD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GUARD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "${ARCH_CHOICE}" in
            *"arm64 only"*) ARCHS=arm64-v8a ;;
            *)              ARCHS=arm64-v8a,armeabi-v7a ;;
          esac
          echo "Architectures: ${ARCHS}"

          chmod +x gradlew
          ./gradlew bundleRelease \
            -PreactNativeArchitectures="${ARCHS}" \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true \
            -Pandroid.injected.signing.store.file="${PWD}/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${STORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Check it was signed with YOUR key, not the debug one
        working-directory: ${{ env.APP_DIR }}/android
        env:
          STORE_PASSWORD: ${{ secrets.GUARD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GUARD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab

          # Every fingerprint below ends in `|| true` on purpose. Each is a
          # pipeline whose grep finds nothing in exactly the cases this step
          # exists to catch -- an unsigned bundle, a missing alias -- and
          # under `set -o pipefail` that would abort the step with a cryptic
          # pipeline failure instead of the explicit error underneath it. The
          # emptiness IS the finding, so it has to survive to be reported.

          # The fingerprint Play has on file for this listing.
          EXPECTED=$(keytool -list -v \
            -keystore app/release.keystore \
            -storepass "${STORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            | grep -oE 'SHA256: [0-9A-F:]+' | head -1 | cut -d' ' -f2 || true)
          [[ -n "${EXPECTED}" ]] || {
            echo "::error::Could not read a SHA-256 fingerprint for alias '${KEY_ALIAS}' out of the keystore. Check GUARD_KEY_ALIAS and GUARD_STORE_PASSWORD."; exit 1; }

          # The fingerprint actually on the bundle. An .aab is jar-signed, so
          # the certificate sits in META-INF as .RSA, .DSA or .EC.
          mkdir -p /tmp/sigcheck
          CERT=$(unzip -Z1 "$AAB" 'META-INF/*' 2>/dev/null | grep -iE '\.(RSA|DSA|EC)$' | head -1 || true)
          [[ -n "${CERT}" ]] || { echo "::error::The bundle carries no signature block at all."; exit 1; }
          unzip -p "$AAB" "${CERT}" > /tmp/sigcheck/cert.bin
          ACTUAL=$(keytool -printcert -file /tmp/sigcheck/cert.bin \
            | grep -oE 'SHA256: [0-9A-F:]+' | head -1 | cut -d' ' -f2 || true)

          echo "expected ${EXPECTED}"
          echo "actual   ${ACTUAL}"
          if [[ "${EXPECTED}" != "${ACTUAL}" ]]; then
            echo "::error::The bundle is NOT signed with the GUARD keystore. Expo signs release with the debug key by default, so the injected signing properties did not apply. Do not upload this."
            exit 1
          fi
          echo "Signed with the GUARD release key."

      - name: Clean up the keystore
        if: always()
        run: rm -f "${APP_DIR}/android/app/release.keystore"

      - name: Inspect the finished bundle
        working-directory: ${{ env.APP_DIR }}/android
        env:
          VERSION_CODE: ${{ steps.v.outputs.code }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          curl -sSL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar bundletool.jar dump manifest --bundle="$AAB" > manifest.txt

          grep -qE "package=\"${APP_ID//./\\.}\"" manifest.txt || {
            echo "::error::Bundle package is not ${APP_ID}"; grep -o 'package="[^"]*"' manifest.txt || true; exit 1; }
          grep -qE "versionCode=\"${VERSION_CODE}\"" manifest.txt || {
            echo "::error::Bundle versionCode is not ${VERSION_CODE}"; grep -o 'versionCode="[^"]*"' manifest.txt || true; exit 1; }
          grep -qF "versionName=\"${VERSION_NAME}\"" manifest.txt || {
            echo "::error::Bundle versionName is not ${VERSION_NAME}"; grep -o 'versionName="[^"]*"' manifest.txt || true; exit 1; }
          grep -qE '(^|[[:space:]:])icon="@mipmap/ic_launcher"' manifest.txt || {
            echo "::error::App icon is not @mipmap/ic_launcher"; grep -io '[a-z:]*icon="[^"]*"' manifest.txt || true; exit 1; }

          SIZE_MB=$(( $(stat -c %s "$AAB") / 1048576 ))
          {
            echo "## Guard native — ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo ""
            echo "Bundle: ${SIZE_MB} MB · package ${APP_ID} · signed with the GUARD release key."
            echo ""
            echo "Download \`app-release.aab\` from **Artifacts** below and upload it in"
            echo "Play Console. Play splits it per device, so what a guard actually"
            echo "downloads is smaller than this."
            echo ""
            echo "**This replaces the Capacitor guard app on the same listing.** Rolling"
            echo "it out to production swaps the WebView shell for the native app on"
            echo "every guard's phone at their next update. A staged rollout, or the"
            echo "internal testing track first, is the cautious route."
            echo ""
            echo '```'
            grep -oE '(package|android:versionCode|android:versionName|android:icon|android:roundIcon|android:label)="[^"]*"' manifest.txt
            echo '```'
            echo ""
            echo "Permissions requested:"
            echo '```'
            grep -oE 'android:name="android\.permission\.[A-Z_]+"' app/src/main/AndroidManifest.xml | sort -u
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the AAB
        uses: actions/upload-artifact@v4
        with:
          name: managesociety-guard-native-${{ steps.v.outputs.name }}-vc${{ steps.v.outputs.code }}
          path: ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
