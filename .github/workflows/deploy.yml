name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # A repository variable that does not exist expands to an EMPTY
      # STRING, not to nothing. Vite prefers a real environment variable
      # over the .env file, so an empty VITE_SUPABASE_URL silently beats
      # the committed value. The build still exits 0 and uploads a
      # bundle whose createClient() throws "supabaseUrl is required."
      # at module scope — before React mounts — so the site serves a
      # blank page and the deploy looks green.
      #
      # Each value is therefore resolved explicitly: the repository
      # variable when it has one, the committed .env entry otherwise,
      # and a named failure if neither does.
      # vite build does not type-check. A component referencing an
      # identifier it never imported therefore compiles cleanly, ships,
      # and throws ReferenceError the moment it renders — a blank page
      # from a deploy that reported success. That is exactly how
      # Index.tsx went out with <Loader2 /> and no import, and because
      # that element sits in the isLoading branch it was the first thing
      # rendered, so every page of the site was blank.
      #
      # A full typecheck cannot gate this repo yet: tsconfig.app.json
      # currently reports 44 pre-existing errors, most of them from a
      # stale src/integrations/supabase/types.ts. So this gates on the
      # single class that blanks the page — a name that does not exist —
      # and lets the rest through until those are cleared.
      #
      # Note the explicit -p. Plain `tsc --noEmit` is a no-op in this
      # repo: tsconfig.json carries "files": [] with project
      # references, so it checks zero files and always exits 0.
      - name: Guard against undefined identifiers
        run: |
          set -uo pipefail
          out="$(npx tsc -p tsconfig.app.json --noEmit 2>&1 || true)"
          undefined_names="$(printf '%s\n' "$out" | grep -E 'error TS(2304|2552):' || true)"
          if [ -n "$undefined_names" ]; then
            printf '%s\n' "$undefined_names" | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "These names are not defined. In a value position one throws ReferenceError the moment it renders, so the build succeeds and the page comes up blank; in a type position it means a missing type import. Fix either before deploying."
            exit 1
          fi
          echo "No undefined identifiers."

      - name: Resolve Supabase build variables
        env:
          VAR_PROJECT_ID:      ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VAR_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VAR_URL:             ${{ vars.VITE_SUPABASE_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in VITE_SUPABASE_PROJECT_ID VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_URL; do
            var_ref="VAR_${name#VITE_SUPABASE_}"
            value="${!var_ref:-}"
            origin="repository variable"

            if [ -z "$value" ] && [ -f .env ]; then
              value="$(sed -n "s/^${name}=//p" .env | head -n1 | tr -d '\r' \
                | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                      -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/")"
              origin=".env"
            fi

            if [ -z "$value" ]; then
              echo "::error::${name} is empty in both the repository variables and .env. Building would ship a bundle that throws 'supabaseUrl is required.' and renders a blank page."
              missing=1
              continue
            fi

            # Only the source is logged, never the value.
            echo "${name}=${value}" >> "$GITHUB_ENV"
            echo "${name} resolved from ${origin}"
          done
          [ "$missing" -eq 0 ]

      - name: Build
        run: npm run build

      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Copy CNAME
        run: cp CNAME dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
