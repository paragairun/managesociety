name: Build Guard Native App

# Builds an installable .apk of the NATIVE guard app (native/guard -- Expo /
# React Native), in the cloud, because building an Android app normally needs
# the Android SDK, Gradle and a JDK installed locally, which this project does
# not assume you have.
#
# This is a different app from mobile-guard/, which is a Capacitor shell that
# just loads managesociety.in/guard in a WebView. This one is real native code:
# its screens, camera, lists and navigation are compiled into the app, so a
# change to the website does NOT change it. Every change needs either a new
# build here, or a reload from Metro (see "development build" below).
#
# ────────────────────────────────────────────────────────────────────────────
# TWO BUILDS, AND WHICH ONE YOU WANT
#
#   development  (default)  Contains no JavaScript. On launch it asks for the
#                           address of a Metro server and loads the app from
#                           there, over the internet. Install it once and
#                           every later code change arrives by restarting
#                           Metro -- no rebuild, no reinstall, no 15-minute
#                           wait. Needs `npx expo start --tunnel` running on
#                           a computer (Node only -- no Android SDK).
#                           USE THIS WHILE WE ARE STILL FIXING THINGS.
#
#   standalone              The JavaScript is compiled in. Runs on its own
#                           with nothing else switched on, so this is the one
#                           to hand to a guard at the gate. Rebuild here for
#                           every change.
#
# Pick with the "build" input when you run the workflow by hand.
#
# ────────────────────────────────────────────────────────────────────────────
# BEFORE YOU INSTALL IT: UNINSTALL THE OLD GUARD APP
#
# This app deliberately keeps the application id in.managesociety.guard, so
# that the Firebase registration (google-services.json) and eventually the
# Play listing carry over to it -- it is meant to replace the Capacitor guard
# app, not sit beside it. Android will not install two apps with the same id,
# and these two are signed with different keys, so installing this one over
# the old one fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE until the old one
# is uninstalled. Uninstall "ManageSociety Guard" on the test phone first.
#
# (To run both side by side instead, the id has to change AND a new Android
# app has to be registered in the Firebase project, because the Google
# Services Gradle plugin fails the build when google-services.json has no
# client for the package it is building.)
#
# ────────────────────────────────────────────────────────────────────────────
# Output: the .apk is published as a GitHub Release asset on a moving tag --
# guard-native-dev or guard-native-standalone -- so the download URL is stable
# and public, and the phone can install straight from its own browser. The
# run's summary page prints the link. A copy is also attached to the run as a
# build artifact, as a fallback.
#
# These are debug-signed builds: fine to install by hand via "install from
# unknown sources", not set up for Play Store distribution (that is
# build-release-aabs.yml's job, and a later step for this app).

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Which build to produce"
        type: choice
        required: true
        default: development
        options:
          - development
          - standalone
      architectures:
        description: "CPU architectures (fewer = smaller APK)"
        type: choice
        required: true
        default: "arm64 only — smallest, every phone since ~2017"
        options:
          - "arm64 only — smallest, every phone since ~2017"
          - "arm64 + 32-bit ARM — for a phone that refuses the above"
          - "all four — adds x86 for emulators, doubles the size"
  push:
    branches: [main]
    paths:
      - 'native/guard/**'
      - 'src/lib/**'
      - '.github/workflows/build-guard-native.yml'

env:
  APP_DIR: native/guard
  APP_ID: in.managesociety.guard

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the APK as a release asset (see the last two steps).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # JDK 17: the version React Native 0.88 and Expo SDK 58 are built
      # against. The Capacitor workflows use 21, which is fine for them, but
      # Expo's own Gradle plugins are tested on 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      # The screens import shared rules from ../../src/lib through Metro's
      # watchFolders (see metro.config.js). A development build loads its
      # JavaScript from Metro at runtime so it never reads them, but a
      # standalone build bundles them in -- and a missing one would surface as
      # a blank screen on a guard's phone rather than an error here.
      - name: Check the shared modules the app imports are present
        run: |
          set -euo pipefail
          missing=0
          for f in gateScan gatePorts visitorFlow visitorFlowPorts deliveries societyStructure staffAttendance; do
            if [[ ! -f "src/lib/$f.ts" ]]; then
              echo "::error::src/lib/$f.ts is missing; native/guard imports it as @core/$f"
              missing=1
            fi
          done
          [[ $missing -eq 0 ]] || exit 1
          echo "All shared modules present."

      # Only this app's dependencies are installed, not the website's, which
      # is the stricter of the two cases and the reason tsconfig.json maps
      # @supabase/supabase-js explicitly: the shared modules under src/lib
      # import SupabaseClient as a type, and TypeScript resolves that from the
      # importing file's own folder outwards -- so it looks for
      # managesociety/node_modules, which exists on a machine that has also
      # installed the website and does not exist here. The import is erased at
      # build time, so this was only ever a typecheck failure, and only away
      # from a full checkout. Do not "fix" a recurrence by installing the root
      # dependencies; fix the mapping.
      - name: Typecheck
        working-directory: ${{ env.APP_DIR }}
        run: npx tsc --noEmit

      # Generates the android/ project from app.json. It is gitignored on
      # purpose: it is output, regenerated on every run, so app.json stays the
      # single place the app's name, icon, permissions and package id live.
      - name: Generate the native Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --clean

      # Same safety check as build-release-aabs.yml, for the same reason:
      # renaming the application id breaks push (google-services.json is
      # registered against it) and would orphan the Play listing. It broke the
      # Capacitor builds once already, on 2026-10-04.
      - name: Check the application id did not drift
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          FOUND=$(grep applicationId android/app/build.gradle | head -1 | tr -d "\"' " | sed 's/^applicationId//')
          echo "applicationId = ${FOUND}"
          if [[ "${FOUND}" != "${APP_ID}" ]]; then
            echo "::error::applicationId is '${FOUND}', expected '${APP_ID}'. Push notifications are registered against the expected id."
            exit 1
          fi

      - name: Confirm Firebase is wired for this package
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          GS=android/app/google-services.json
          if [[ ! -f "$GS" ]]; then
            echo "::error::google-services.json was not copied into the project. Check the googleServicesFile path in app.json."
            exit 1
          fi
          if ! grep -q "${APP_ID}" "$GS"; then
            echo "::error::google-services.json has no client for ${APP_ID}; push would not initialise."
            exit 1
          fi
          echo "Firebase client found for ${APP_ID}."

      # ────────────────────────────────────────────────────────────────────
      # SIZE
      #
      # Measured on the first builds: the development APK was ~270 MB and the
      # standalone one ~110 MB. Almost all of both is CPU architectures.
      #
      # Expo's gradle.properties ships
      #   reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
      # so an unconstrained APK carries FOUR complete copies of React Native's
      # native libraries. x86 and x86_64 exist for emulators -- no Android
      # phone sold in years uses them -- and armeabi-v7a is 32-bit, which only
      # matters on hardware older than roughly 2017. Dropping to arm64-v8a
      # alone removes three of the four. The template's own gradle.properties
      # documents -PreactNativeArchitectures as the supported override, which
      # is why this is a flag and not a patch to a file prebuild regenerates.
      #
      # The rest of the difference between the two builds is debug symbols in
      # those libraries -- the release variant strips them, a debug build
      # cannot, since they are what makes a native crash readable -- plus the
      # dev launcher and Hermes debugger, which exist only in the development
      # build and are the reason it is useful.
      #
      # Minification is already on for release (the template sets
      # android.enableMinifyInReleaseBuilds=true); resource shrinking is not,
      # so this turns it on. Both are release-only: R8 on a debug build would
      # strip the debugging the build exists to provide.
      #
      # If a phone ever answers an install with "app not installed" or dies at
      # launch, a 32-bit-only device is the first thing to suspect: re-run with
      # the arm64 + 32-bit ARM option.
      - name: Build the APK
        id: build
        working-directory: ${{ env.APP_DIR }}/android
        env:
          # A push-triggered run has no inputs, so it produces the build we
          # iterate on, at the smallest size.
          BUILD_KIND: ${{ inputs.build || 'development' }}
          ARCH_CHOICE: ${{ inputs.architectures || 'arm64 only' }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          # The input is worded for whoever is clicking Run workflow, so match
          # on its distinguishing word rather than the whole sentence.
          case "${ARCH_CHOICE}" in
            *"all four"*)        ARCHS=armeabi-v7a,arm64-v8a,x86,x86_64 ;;
            *"32-bit"*)          ARCHS=arm64-v8a,armeabi-v7a ;;
            *)                   ARCHS=arm64-v8a ;;
          esac
          echo "Architectures: ${ARCHS}"

          if [[ "${BUILD_KIND}" == "standalone" ]]; then
            # The release variant is what embeds the JavaScript bundle. Expo's
            # generated project signs release with the debug keystore unless
            # you supply your own, so this comes out installable by hand --
            # which is all a gate phone needs. Play Store signing is a
            # separate job, as it is for the Capacitor apps.
            ./gradlew assembleRelease \
              -PreactNativeArchitectures="${ARCHS}" \
              -Pandroid.enableShrinkResourcesInReleaseBuilds=true
            APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          else
            ./gradlew assembleDebug -PreactNativeArchitectures="${ARCHS}"
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          fi
          if [[ -z "${APK}" ]]; then
            echo "::error::Gradle finished but produced no APK."
            exit 1
          fi
          mkdir -p ../artifact
          cp "${APK}" "../artifact/managesociety-guard-${BUILD_KIND}.apk"

          # Reported on the run summary so the next "how big is it?" is
          # answerable without installing anything.
          SIZE_MB=$(( $(stat -c %s "../artifact/managesociety-guard-${BUILD_KIND}.apk") / 1048576 ))
          echo "size_mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"
          echo "archs=${ARCHS}" >> "$GITHUB_OUTPUT"
          echo "APK is ${SIZE_MB} MB"
          unzip -l "../artifact/managesociety-guard-${BUILD_KIND}.apk" \
            | awk '$4 ~ /^lib\/[^\/]+\/.+/ {split($4,p,"/"); s[p[2]]+=$1} END {for (a in s) printf "  %-14s %6.1f MB of native libraries\n", a, s[a]/1048576}' \
            | sort

      # Published as a release asset, NOT only as a build artifact.
      #
      # Artifacts are served from Azure Blob storage behind a per-account
      # egress limit, and that limit is shared across everything the account
      # downloads: on 2026-10-29 the download failed outright with
      # "ServerBusy / Egress is over the account limit". They also require a
      # signed-in session, so the only way to get one onto a phone is to
      # download it on a computer and transfer it.
      #
      # A release asset is a plain, stable, public URL. It can be opened
      # directly in the phone's browser, which is the whole install flow in
      # one step, and the URL does not change between builds -- so there is
      # nothing to re-send after each rebuild.
      #
      # One moving tag per build kind, so a standalone build never overwrites
      # the development APK the phone is pointed at.
      - name: Publish the APK where a phone can reach it
        id: release
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_KIND: ${{ inputs.build || 'development' }}
          APK_SIZE: ${{ steps.build.outputs.size_mb }}
          APK_ARCHS: ${{ steps.build.outputs.archs }}
        run: |
          set -euo pipefail
          case "${BUILD_KIND}" in
            standalone)  TAG=guard-native-standalone ;;
            *)           TAG=guard-native-dev ;;
          esac
          APK="artifact/managesociety-guard-${BUILD_KIND}.apk"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "${APK}")"

          {
            echo "ManageSociety Guard — native ${BUILD_KIND} build"
            echo ""
            echo "Built from ${GITHUB_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo "${APK_SIZE} MB, built for ${APK_ARCHS}."
            echo ""
            echo "Open this page on the phone and tap the .apk below to install."
            echo "Uninstall the existing \"ManageSociety Guard\" app first: this one"
            echo "keeps the same application id and is signed with a different key,"
            echo "so Android refuses the install until the old one is gone."
            echo ""
            if [[ "${BUILD_KIND}" == "development" ]]; then
              echo "This build contains no JavaScript. Start Metro on a computer with"
              echo "'cd native/guard && npx expo start', then scan the QR code from"
              echo "inside the app. Later code changes arrive by reloading."
            else
              echo "This build runs on its own, with nothing else switched on."
            fi
          } > notes.txt

          # The tag moves with each build, so the old release is replaced
          # rather than accumulating one per run. --cleanup-tag removes the
          # tag too, so the next create re-points it at this commit.
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" "${APK}" \
            --title "Guard native — ${BUILD_KIND}" \
            --notes-file notes.txt \
            --prerelease \
            --target "${GITHUB_SHA}"

          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "page=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"

      # Kept as a second copy. Costs nothing, and covers the case where the
      # release step is the thing that fails.
      - name: Upload the APK as a build artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managesociety-guard-native-${{ inputs.build || 'development' }}-apk
          path: ${{ env.APP_DIR }}/artifact/*.apk
          if-no-files-found: warn

      - name: What to do with it
        env:
          BUILD_KIND: ${{ inputs.build || 'development' }}
          APK_URL: ${{ steps.release.outputs.url }}
          APK_PAGE: ${{ steps.release.outputs.page }}
          APK_SIZE: ${{ steps.build.outputs.size_mb }}
          APK_ARCHS: ${{ steps.build.outputs.archs }}
        run: |
          {
            echo "## ManageSociety Guard (native) — ${BUILD_KIND} build"
            echo ""
            echo "APK size: **${APK_SIZE} MB** (${APK_ARCHS})"
            echo ""
            echo "**Install it:** open this on the phone and tap the \`.apk\`:"
            echo ""
            echo "${APK_PAGE}"
            echo ""
            echo "Direct link: ${APK_URL}"
            echo ""
            echo "**Uninstall the existing \"ManageSociety Guard\" app first** — this one"
            echo "shares its application id (\`${APP_ID}\`) and is signed with a different key."
            echo ""
            if [[ "${BUILD_KIND}" == "development" ]]; then
              echo "This build holds no JavaScript. After installing it:"
              echo ""
              echo '1. On your computer: `cd native/guard && npx expo start`'
              echo "2. Open the app on the phone and scan the QR code the terminal prints."
              echo ""
              echo "Every later code change is picked up by reloading in the app — no rebuild."
              echo ""
              echo "The URL above does not change between builds, so there is nothing to"
              echo "re-send after a rebuild: reinstall from the same page."
            else
              echo "This build runs on its own. Install it and hand the phone to a guard."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
