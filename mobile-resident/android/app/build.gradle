apply plugin: 'com.android.application'

// ── App identity: DO NOT CHANGE ──────────────────────────────────────────────
// applicationId "in.visitorpasses.resident" is this app's permanent identity on
// Google Play: Play only accepts updates with the SAME id, and
// google-services.json (Firebase / push) is registered for this id. Renaming
// it to in.managesociety.resident broke every build and would have made Play treat
// the bundle as a different app. The name users see (app_name in
// res/values/strings.xml, appName in capacitor.config.ts) can change freely.
//
// ── App version ──────────────────────────────────────────────────────────────
// The release workflow (.github/workflows/build-release-aabs.yml) passes
// -PappVersionCode / -PappVersionName on every build; nothing to edit here.
// Local builds use these defaults.
def appVersionCode = (project.findProperty('appVersionCode') ?: '3').toString().toInteger()
def appVersionName = (project.findProperty('appVersionName') ?: '3.0').toString()

android {
    namespace = "in.visitorpasses.resident"
    compileSdk = rootProject.ext.compileSdkVersion
    // Explicit, committed debug keystore so every build (local or CI) signs
    // with the SAME certificate -- otherwise Gradle auto-generates a NEW,
    // different debug key on machines/runners where none exists yet, which
    // would silently invalidate any SHA-1-based API key restriction the
    // moment you rebuild somewhere new (like a fresh GitHub Actions runner).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Populated from GitHub Actions secrets at build time -- never
            // committed to the repo, unlike the shared debug keystore.
            storeFile file(System.getenv("SIGNING_KEYSTORE_PATH") ?: "release.keystore")
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    }
    defaultConfig {
        applicationId "in.visitorpasses.resident"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
